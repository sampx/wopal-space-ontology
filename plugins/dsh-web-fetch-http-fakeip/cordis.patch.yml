# @wopal/dsh-web-fetch-http-fakeip: replaces the shipped web-fetch-http
# provider with a fork that allows the Clash TUN fake-ip range (198.18.0.0/15)
# so ctx.web / web_fetch works behind the user's proxy while keeping every
# other SSRF guard intact.
#
# Two steps, per the patch contract (a patch may not change a row's `name`):
#   1. disable the shipped row (id web-fetch-http);
#   2. insert a NEW row with a DIFFERENT id (web-fetch-http-wopal) that names
#      THIS package. The fork registers the same provider id "http" as the
#      shipped provider, so the `web` row's `fetchProvider: http` resolves to
#      it unchanged.
- id: web-fetch-http
  disabled: true

- insert:
    - id: web-fetch-http-wopal
      name: '@wopal/dsh-web-fetch-http-fakeip'
